# App Platform spec for the reference instance (SETUP.md §2).
# Create with: doctl apps create --spec .do/app.yaml
# (or paste into the dashboard's app-spec editor).
#
# deploy_on_push is off by design: once the pipeline runs, its
# reconcile merge is the deploy trigger; before that, deploys are
# manual (`doctl apps create-deployment <app-id>`).
#
name: catapult
region: sfo

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: SwaggerAllen/catapult
      branch: main
      deploy_on_push: false
    http_port: 4000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db-pgsql-sfo2-33976.DATABASE_URL}

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: SwaggerAllen/catapult
      branch: main
      deploy_on_push: false
    run_command: /app/bin/catapult eval "Catapult.Release.migrate()"
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db-pgsql-sfo2-33976.DATABASE_URL}

databases:
  # Attached through the dashboard, which names the spec component
  # after the cluster — the ${...} refs above resolve against this
  # name, not the cluster_name field (the two happen to coincide
  # here; they are different fields).
  - name: db-pgsql-sfo2-33976
    engine: PG
    version: "16"
    production: true
    cluster_name: db-pgsql-sfo2-33976
