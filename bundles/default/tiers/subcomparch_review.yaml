# docs/v5-design-decisions.md §7.19, revised: a review is a tier, not
# a nested block on subcomparch.yaml. `reviews: subcomparch` fixes
# this review's scope and cardinality to subcomparch's own
# (per(subcomp), 1:1) — not restated, dsl-syntax.md §3.3. `context:`
# is the same set of walks as subcomparch's own, checked at load time
# (§13) rather than trusted; `draft`/`prior_review` reach the prompt
# automatically (§9) and are never context: entries.
tier: subcomparch_review
reviews: subcomparch
generator: llm
prompt: prompts/review/subcomparch.md.liquid
grammar: schemas/review.xsd
context:
  - self.parent.handle
  - self.parent.dependency -> subcomp.handle.fragments[pubapi]
  - self.reference -> ref.handle
delivery:
  phase: critique
  agent_step: critique
