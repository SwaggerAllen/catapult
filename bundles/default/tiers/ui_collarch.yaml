# No siege source — v5 §5.1-§5.4, authored fresh. Mirrors comparch
# (tiers/comparch.yaml): its <subcomponents> block mints one
# ui_subcomp per child (the `decomposition` edge's ui_collarch->
# ui_subcomp instance, edges/decomposition.yaml) and its produces:
# writes the five fragments onto self.parent — the ui_coll, not onto
# the children it just minted. No `<owns>` block claiming parent resp/
# feat slices the way comparch's subcomponents do: a UI collection
# fulfills no resp (v5 §5.4), so there is nothing for a subcomponent to
# claim a slice of; ownership here is purely the collection's own
# internal decomposition. Two edges distinguish this tier's dependency
# reads from comparch's: `uses_shapes` (types/handle shapes only, never
# calls — v5 §5.4's layering rule) reaches backend `comp`, and the
# `dependency` edge's own `ui_coll -> design_system` instance reaches
# the pinned design system (primitives). No `policy_application`
# reads: a UI collection fulfills no resp, so the through-responsibility
# grain has nothing to scope through, and a direct collection-to-policy
# link is speculative surface with no cited need behind it
# (systems/platform_content.md's ORC-111 entry).
tier: ui_collarch
scope: per(ui_coll)
identity: id
fields:
  decomposition_summary: draft.subcomponents
handle:
  fields: [id, decomposition_summary]
  fragments: []
draft:
  root_tag: ui-collarch
  grammar: schemas/ui_collarch.xsd
generator: llm
executor:
  effort: max
prompt: prompts/ui_collarch.md.liquid
context:
  - self.parent.handle
  - self.parent.dependency -> ui_coll.handle.fragments[pubapi]
  - self.parent.dependency -> ui_coll.handle.fragments[failure_surface]
  - self.parent.uses_shapes -> comp.handle.fragments[pubapi]
  - self.parent.dependency -> design_system.handle
  - self.reference -> ref.handle
  - all.vocab.handle
produces:
  - fragment: { owner: self.parent, kind: techspec, authored: draft.technical-specification }
  - fragment: { owner: self.parent, kind: pubapi, authored: draft.public-surface }
  - fragment: { owner: self.parent, kind: privapi, authored: draft.private-surface }
  - fragment: { owner: self.parent, kind: policies, authored: draft.policies }
  - fragment: { owner: self.parent, kind: failure_surface, authored: draft.failure-surface }
delivery:
  phase: generation
  agent_step: design
