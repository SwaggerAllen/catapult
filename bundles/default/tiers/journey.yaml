# Projection tier, requirements/resp's own shape: no draft, no
# prompt, no review of its own — minted by journeys' own
# `decomposition` instance (edges/decomposition.yaml) from each
# <journey> row. Unlike resp's minimal `id, name, feats`, this handle
# carries everything the mint row does — name, argument, feats, the
# ordered screen-walk, the journey state block
# (systems/platform_content.md's ORC-109 entry) — because `screens`
# (edges/reference.yaml's journey->screen instance) and `requirements`
# (the resp->journey instance) are both downstream readers that need
# the body, not just identity. The ordered screen-walk
# (`screen_walk`) stays informal — a per-journey list of screen slugs,
# read but not loader-validated, the same status `feats` already has
# — because screens don't exist yet when journeys runs; a formal,
# loader-checked "screen belongs to this journey" fact is declared
# separately, on the screens side, once screens exist
# (edges/reference.yaml).
tier: journey
scope: child_of(journeys)
identity: id
fields:
  name: mint.name
  argument: mint.argument
  feats: mint.feats
  screen_walk: mint.screen_walk
  state: mint.state
handle:
  fields: [id, name, argument, feats, screen_walk, state]
  fragments: []
generator: synthesis
