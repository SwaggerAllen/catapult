# docs/v5-design-decisions.md §7.19: a review is a tier, not a nested
# block. `reviews: screen_collarch` fixes this review's scope and
# cardinality to screen_collarch's own (per(screen_coll), 1:1) — not
# restated, dsl-syntax.md §3.3. `context:` is the same set of walks as
# screen_collarch's own, checked at load time (§13) rather than
# trusted; `draft`/`prior_review` reach the prompt automatically (§9)
# and are never context: entries.
tier: screen_collarch_review
reviews: screen_collarch
generator: llm
prompt: prompts/review/screen_collarch.md.liquid
grammar: schemas/review.xsd
context:
  - self.parent.handle
  - self.parent.fulfills -> screen.handle
  - self.parent.dependency -> screen_coll.handle.fragments[pubapi]
  - self.parent.dependency -> screen_coll.handle.fragments[failure_surface]
  - self.parent.renders -> ui_coll.handle.fragments[pubapi]
  - self.parent.calls -> comp.handle.fragments[pubapi]
  - self.parent.reference -> journey.handle
  - self.reference -> ref.handle
  - all.vocab.handle
delivery:
  phase: critique
  agent_step: critique
