# docs/v5-design-decisions.md §7.19, revised: a review is a tier, not
# a nested block on requirements.yaml. `reviews: requirements` fixes
# this review's scope and cardinality to requirements' own
# (per(feature_expansion), 1:1) — not restated, dsl-syntax.md §3.3.
# `context:` is the same set of walks as requirements' own, checked at
# load time (§13) rather than trusted; `draft`/`prior_review` reach
# the prompt automatically (§9) and are never context: entries.
tier: requirements_review
reviews: requirements
generator: llm
prompt: prompts/review/requirements.md.liquid
grammar: schemas/review.xsd
context:
  - self.parent.handle
delivery:
  phase: critique
  agent_step: critique
