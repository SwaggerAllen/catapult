# A "join target" tier, subcomp's own shape (tiers/subcomp.yaml):
# minted by screen_collarch's `decomposition` edge
# (edges/decomposition.yaml) from a <subcomponent> row, content lives
# in the (three) fragments screen_subcomparch writes onto self.parent.
# `parent_*` fields mirror the screen_coll-level fragments
# screen_collarch already wrote (mint-time copy, same reasoning as
# subcomp.yaml's own parent_* fields).
tier: screen_subcomp
scope: child_of(screen_collarch)
identity: id
fields:
  name: mint.name
  purpose: mint.purpose
  owns_summary: mint.owns_summary
  parent_techspec: mint.parent_techspec
  parent_pubapi: mint.parent_pubapi
  parent_privapi: mint.parent_privapi
  parent_policies_summary: mint.parent_policies_summary
  parent_failure_surface: mint.parent_failure_surface
handle:
  fields:
    [
      id,
      name,
      purpose,
      owns_summary,
      parent_techspec,
      parent_pubapi,
      parent_privapi,
      parent_policies_summary,
      parent_failure_surface,
    ]
  fragments: [techspec, pubapi, privapi]
generator: synthesis
