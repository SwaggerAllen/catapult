# v4 §1.12 + v5's flat-pool reading.
# child_of(feature_expansion), not v4's singleton/per(feature_id) pair —
# per(feature_id) is not an expressible scope (per(X) takes a tier, and
# there is no minted feature tier — seed-docs/README.md names exactly
# three v4→v5 deltas and a minted feature tier isn't one of them, so
# features stay body content on feature_expansion, referenced by name).
# A feature-local entry instead carries a plain `feature_name` field —
# data, not an edge — set at mint time from the same <vocabulary> row
# a project-level entry comes from. One pool either way.
tier: vocab
scope: child_of(feature_expansion)
identity: id
fields:
  name: mint.name
  term_scope: mint.term_scope
  feature_name: mint.feature_name
handle:
  fields: [id, name, term_scope, feature_name]
  fragments: []
draft:
  root_tag: vocab-entry
  grammar: schemas/vocab.xsd
generator: llm
prompt: prompts/vocab.md.liquid
context:
  - self.parent.handle
delivery:
  phase: generation
  agent_step: design
