# The refactor flow's planning tier. No siege prompt exists for this
# flow, and refactor differs from feature_request in scope: it adds
# no new functionality, it reshapes how existing functionality is
# delivered. So this tier's prompt is authored fresh and kept small
# rather than padded to match the feature_request flow's length.
#
# `scope: cascade_visit` (dsl-syntax.md §3.1) — one plan per node the
# refactor's downward_cascade visits, resolved via `self.plan_target`
# (edges/plan_target.yaml) exactly as feature_request_plan.yaml
# describes. Previously `scope: singleton` with `context:
# [input.project_doc]` only, which design review named directly: a
# singleton plan cannot see the component graph it is meant to
# reshape. `all.comp.handle` below is the fix.
tier: refactor_plan
scope: cascade_visit
identity: id
fields:
  # `argument` is the reserved `fields:` name the work surface reads
  # off a flow's entry tier (ORC-114, docs/dsl-syntax.md §3) — this
  # tier is that entry tier for every refactor flow instance.
  argument: draft.argument
  scope_summary: draft.scope
  resolved: draft.resolved
handle:
  fields: [id, scope_summary, resolved]
  fragments: []
draft:
  root_tag: refactor-plan
  grammar: schemas/refactor_plan.xsd
generator: llm
prompt: flows/refactor/plan.md.liquid
context:
  # No `ticket.findings` — not yet a registered context source
  # (feature_request_plan.yaml's context: comment explains why).
  - input.project_doc
  - all.sysarch.handle
  - all.comp.handle
  - self.plan_target -> sysarch.handle
  - self.plan_target -> comparch.handle
  - self.plan_target -> subcomparch.handle
  - self.plan_target -> impl_backend.handle
delivery:
  phase: generation
  agent_step: design
