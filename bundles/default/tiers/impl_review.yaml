# docs/v5-design-decisions.md §7.19, revised: a review is a tier, not
# a nested block on impl.yaml. `reviews: impl` fixes this review's
# scope and cardinality to impl's own (per(subcomp), 1:1) — not
# restated, dsl-syntax.md §3.3. `context:` is the same set of walks as
# impl's own, checked at load time (§13) rather than trusted;
# `draft`/`prior_review` reach the prompt automatically (§9) and are
# never context: entries.
tier: impl_review
reviews: impl
generator: llm
prompt: prompts/review/impl.md.liquid
grammar: schemas/review.xsd
context:
  - self.parent.handle
  - self.parent.dependency -> subcomp.handle.fragments[pubapi]
  - self.reference -> ref.handle
  - all.feature_expansion.handle
delivery:
  phase: critique
  agent_step: critique
