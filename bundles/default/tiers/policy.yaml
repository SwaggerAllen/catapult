# v4 §1.11, re-scoped per v5 §4.5's three grains (this ticket's
# redirect §5): project-global (no scope edge), through-responsibilities
# (policy_scope_resp — the load-bearing grain, since a policy bound to
# a resp survives a sysarch re-decomposition), and direct component
# links for genuinely structural policies (policy_scope_comp). Never
# child_of(resp) — the redirect is explicit that parenting by resp
# would be wrong even though scoping through it is right.
#
# `child_of(sysarch)` names sysarch as the tier this pool's scope is
# validated against, but two fanout edges mint into it —
# policy_fanout (sysarch's project-level <policies>) and
# policy_fanout_comp (comparch's component-local <policies>). Nothing
# in dsl-syntax.md's closed scope vocabulary expresses "child of
# either of these two tiers", and lib/catapult/dsl/tier.ex's
# scope_problems check only verifies child_of(X) names a *declared*
# tier — it does not require X to be the sole edge targeting this
# tier, so two fanout edges into one flat pool is legal under the
# loader as implemented today. Recorded here rather than left
# implicit, per this ticket's own instruction to name interpretations.
tier: policy
scope: child_of(sysarch)
identity: id
fields:
  name: mint.name
  trigger: mint.trigger
  rationale: mint.rationale
handle:
  fields: [id, name, trigger, rationale]
  fragments: []
generator: synthesis
