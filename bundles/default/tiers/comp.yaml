# A "join target" tier.
# Projection tier: no draft, no prompt: content lives entirely in the
# fragments comparch writes onto self.parent (comparch.yaml's
# produces:). `mint.*` fields are set when sysarch's `decomposition`
# edge (edges/decomposition.yaml) mints this node from its own
# <components> row (dsl-syntax.md §3 has no documented field source
# for a join-target tier; the addendum this ticket adds there names
# `mint.<field>` for exactly this case — see the diff to
# docs/dsl-syntax.md). `project_techspec` and `project_policies_summary`
# are the one exception to "content lives in fragments written by
# comparch": a plain-string copy of sysarch's own techspec/policies,
# made at the same mint moment. dsl-syntax.md §7.1's reversed hop
# (added this pass) *could* now reach it live —
# `self.parent.decomposition~ -> sysarch.handle` from comparch — but
# the mint-time copy stays: this content is written once by sysarch
# and changes only on a full re-decomposition, which re-mints comp
# anyway, so a live two-hop walk buys nothing a plain scalar doesn't
# already give more simply. Recorded in systems/platform_content.md.
tier: comp
scope: child_of(sysarch)
identity: id
fields:
  name: mint.name
  purpose: mint.purpose
  is_foundation: mint.is_foundation
  project_techspec: mint.project_techspec
  project_policies_summary: mint.project_policies_summary
handle:
  fields: [id, name, purpose, is_foundation, project_techspec, project_policies_summary]
  fragments: [techspec, pubapi, privapi, policies, failure_surface]
generator: synthesis
