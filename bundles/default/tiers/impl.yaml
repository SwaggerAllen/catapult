# v4 §1.8, re-expressed with the phase dimension dropped entirely
# (docs/v5-design-decisions.md §6: "Dropped from v4: the phase
# machinery" — one impl doc per subcomponent describing the total end
# state, `scope: per(subcomp)` rather than v4's `per(subcomp) ×
# phase`). `<tests>` is new grammar, not a v4 port: v5 §2.8/§6 makes
# it normative for reconciliation ("named test descriptions are the
# acceptance criteria"), and there is no `<tests>` block anywhere in
# seed-docs/siege-prompts/impl.md to draw from — authored fresh.
tier: impl
scope: per(subcomp)
identity: id
fields:
  behavior_summary: draft.behavior
handle:
  fields: [id, behavior_summary]
  fragments: []
draft:
  root_tag: implementation
  grammar: schemas/impl.xsd
generator: llm
prompt: prompts/impl.md.liquid
context:
  - self.parent.handle
  - self.parent.dependency -> subcomp.handle.fragments[pubapi]
  - self.reference -> ref.handle
  - all.feature_expansion.handle
  # Stands in for v4's `self.related_features -> feature.handle`: v5
  # mints no separate `feature` tier (docs/non-goals.md, vocab.yaml's
  # own comment — a feature stays body content on feature_expansion,
  # never a per-feature node `per(feature_id)` could name), so "the
  # features this impl relates to" reduces to "the project's feature
  # intent", which is feature_expansion's own singleton content.
review:
  prompt: prompts/review/impl.md.liquid
  grammar: schemas/review.xsd
delivery:
  phase: generation
  agent_step: design
