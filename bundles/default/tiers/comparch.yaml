# seed-docs/siege-prompts/comparch.md is the prose source;
# domain/presentational content stripped per v5 §4.1, see
# sysarch.yaml. Decomposes: its <subcomponents> block mints one
# subcomp per child (the `decomposition` edge's comparch->subcomp
# instance, edges/decomposition.yaml) and its produces: writes
# the five fragments onto self.parent — the comp, not onto the
# children it just minted. v5 growth per
# docs/v5-design-decisions.md §2.9/§2.16/§6: <permissions>,
# <enforcement>, per-scope <implementation> (stub grade).
tier: comparch
scope: per(comp)
identity: id
fields:
  decomposition_summary: draft.subcomponents
handle:
  fields: [id, decomposition_summary]
  fragments: []
draft:
  root_tag: comparch
  grammar: schemas/comparch.xsd
generator: llm
executor:
  effort: max
prompt: prompts/comparch.md.liquid
context:
  - self.parent.handle
  - self.parent.fulfills -> resp.handle
  - self.parent.dependency -> comp.handle.fragments[pubapi]
  - self.parent.dependency -> comp.handle.fragments[failure_surface]
  - self.reference -> ref.handle
  - self.parent.policy_application~ -> policy.handle
  # Direct grain (v5 §4.5's third): policies scoped straight to this
  # comp (policy_scope_comp, carried in policy_application's first
  # instance — `chain.md` #27). A reversed hop: policy is the
  # edge's declared source, comp is its target, and comparch is
  # reading "who points at my parent", not "where my parent points".
  - self.parent.fulfills.policy_application~ -> policy.handle
  # Through-responsibility grain (v5 §4.5's load-bearing one):
  # self.parent (comp) -> fulfills (forward) -> resp, then resp's
  # inbound policy_application edges (reversed) -> every policy scoped
  # through this comp's own responsibility. `chain.md` #19 is the
  # two-hop, one-reversed grammar this needs. Both entries above name
  # `policy` as their target and combine into one collection
  # (`chain.md` #35) — the prompt sees "every applied policy",
  # not one variable per grain. The project-global grain (no scope
  # edge at all) is deliberately not read here: `all.policy` would
  # also return every resp- and comp-scoped policy, which comparch
  # must not see indiscriminately. That grain's other producer
  # (ORC-108) is non_goals — see non_goals.yaml, which mints straight
  # into this same `policy` pool with no scope edge.
  - all.vocab.handle
  # Project vocabulary (v5 §4.5): a flat, project-wide pool
  # with no structural relationship to comparch to walk — `chain.md`
  # #19's `all.<tier>` is exactly this case. Keeps downstream prose
  # handles consistent with the terms feature_expansion already named.
produces:
  - fragment: { owner: self.parent, kind: techspec, authored: draft.technical-specification }
  - fragment: { owner: self.parent, kind: pubapi, authored: draft.public-surface }
  - fragment: { owner: self.parent, kind: privapi, authored: draft.private-surface }
  - fragment: { owner: self.parent, kind: policies, authored: draft.policies }
  - fragment: { owner: self.parent, kind: failure_surface, authored: draft.failure-surface }
delivery:
  phase: generation
  agent_step: design
enforcement: []
