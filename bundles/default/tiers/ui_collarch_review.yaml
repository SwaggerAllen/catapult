# docs/v5-design-decisions.md §7.19: a review is a tier, not a nested
# block. `reviews: ui_collarch` fixes this review's scope and
# cardinality to ui_collarch's own (per(ui_coll), 1:1) — not restated
# (`chain.md` #14). `context:` is the same set of walks as
# ui_collarch's own, checked at load time rather than trusted;
# `draft`/`prior_review` reach the prompt automatically (`chain.md` #35) and are
# never context: entries.
tier: ui_collarch_review
reviews: ui_collarch
generator: llm
prompt: prompts/review/ui_collarch.md.liquid
grammar: schemas/review.xsd
context:
  - self.parent.handle
  - self.parent.dependency -> ui_coll.handle.fragments[pubapi]
  - self.parent.dependency -> ui_coll.handle.fragments[failure_surface]
  - self.parent.uses_shapes -> comp.handle.fragments[pubapi]
  - self.parent.dependency -> design_system.handle
  - self.reference -> ref.handle
  - all.vocab.handle
delivery:
  phase: critique
  agent_step: critique
