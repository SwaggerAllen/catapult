# v4 §1.2, re-expressed against v5's restored `resp` tier
# (seed-docs/README.md): requirements still performs the
# features→responsibilities rotation, but each atom it emits is now
# minted as its own `resp` node (resp_fanout) rather than staying a
# field inside this tier's own body. `scope: per(feature_expansion)`
# rather than `singleton` — both read as "exactly one instance"
# (feature_expansion is itself a singleton), but only per(X) gives
# this tier a self.parent walk back to feature_expansion's handle;
# dsl-syntax.md's context-walk grammar has no other route to an
# upstream singleton's content. Recorded in
# systems/platform_content.md; the same substitution repeats at
# sysarch.
tier: requirements
scope: per(feature_expansion)
identity: id
fields:
  intro: draft.introduction
handle:
  fields: [id, intro]
  fragments: []
draft:
  root_tag: requirements
  grammar: schemas/requirements.xsd
generator: llm
executor:
  effort: max
prompt: prompts/requirements.md.liquid
context:
  - self.parent.handle
review:
  prompt: prompts/review/requirements.md.liquid
  grammar: schemas/review.xsd
delivery:
  phase: generation
  agent_step: design
