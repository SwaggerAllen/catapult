# Mirrors impl_backend (tiers/impl_backend.yaml): one impl doc per
# subcomponent describing the total end state, `scope:
# per(ui_subcomp)`. Reuses `schemas/impl.xsd` — the `<implementation>`
# shape (behavior/invariants/sequencing/edge-cases/tests/references) is
# generic prose grammar with no backend-specific coupling, so a second
# copy of the same schema would be a duplicate rather than a distinct
# grammar (systems/platform_content.md's ORC-111 entry, "the identical
# mint-then-articulate shape the backend chain already has").
tier: impl_ui
scope: per(ui_subcomp)
identity: id
fields:
  behavior_summary: draft.behavior
handle:
  fields: [id, behavior_summary]
  fragments: []
draft:
  root_tag: implementation
  grammar: schemas/impl.xsd
generator: llm
prompt: prompts/impl_ui.md.liquid
context:
  - self.parent.handle
  - self.parent.dependency -> ui_subcomp.handle.fragments[pubapi]
  - self.reference -> ref.handle
  - all.feature_expansion.handle
delivery:
  phase: generation
  agent_step: design
