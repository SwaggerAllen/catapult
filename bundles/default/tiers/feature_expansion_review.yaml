# docs/v5-design-decisions.md §7.19, revised: a review is a tier, not
# a nested block on feature_expansion.yaml. `reviews:
# feature_expansion` fixes this review's scope and cardinality to
# feature_expansion's own (singleton, 1:1) — not restated
# (`chain.md` #14). `context:` is the same set of walks as
# feature_expansion's own, checked at load time rather than
# trusted; `draft`/`prior_review` reach the prompt automatically (`chain.md` #35)
# and are never context: entries.
tier: feature_expansion_review
reviews: feature_expansion
generator: llm
prompt: prompts/review/feature_expansion.md.liquid
grammar: schemas/review.xsd
context:
  - input.project_doc
  - input.mocks
delivery:
  phase: critique
  agent_step: critique
