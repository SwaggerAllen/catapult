# First-class node between features and screens (v5 §4.2). Design
# record: systems/platform_content.md's ORC-109 entry — the same
# requirements/resp shape: one llm-authored draft, one `decomposition`
# fanout minting a `journey` per <journey> row (edges/decomposition
# .yaml). `scope: per(feature_expansion)`, reading only the parent
# handle — the same relationship requirements had to feature_expansion
# before this ticket inserted journeys and screens ahead of it in the
# chain (`inputs -> feature_expansion -> journeys -> screens ->
# requirements -> sysarch -> …`, v5 §4.1).
tier: journeys
scope: per(feature_expansion)
identity: id
fields:
  intro: draft.introduction
handle:
  fields: [id, intro]
  fragments: []
draft:
  root_tag: journeys
  grammar: schemas/journeys.xsd
generator: llm
executor:
  effort: max
prompt: prompts/journeys.md.liquid
context:
  - self.parent.handle
delivery:
  phase: generation
  agent_step: design
