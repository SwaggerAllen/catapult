tier: screen_subcomparch
scope: per(screen_subcomp)
identity: id
fields:
  role_summary: draft.technical_specification
handle:
  fields: [id, role_summary]
  fragments: []
draft:
  root_tag: screen_subcomparch
  grammar: schemas/screen_subcomparch.xsd
generator: llm
prompt: prompts/screen_subcomparch.md.liquid
context:
  - self.parent.handle
