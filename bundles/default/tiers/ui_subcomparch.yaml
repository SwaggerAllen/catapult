# No siege source — v5 §5.1-§5.4, authored fresh. Mirrors subcomparch
# (tiers/subcomparch.yaml): produces: writes onto self.parent — the
# ui_subcomp. Only three fragments, the same 5-then-3 fragment-
# ownership split ORC-84 settled for the backend pair, applied here
# (systems/platform_content.md's ORC-111 entry) — the fragment
# vocabulary is a bundle-wide closed set, not a per-family one.
tier: ui_subcomparch
scope: per(ui_subcomp)
identity: id
fields:
  role_summary: draft.technical-specification
handle:
  fields: [id, role_summary]
  fragments: []
draft:
  root_tag: ui-subcomparch
  grammar: schemas/ui_subcomparch.xsd
generator: llm
prompt: prompts/ui_subcomparch.md.liquid
context:
  - self.parent.handle
  - self.parent.dependency -> ui_subcomp.handle.fragments[pubapi]
  - self.reference -> ref.handle
  - all.vocab.handle
produces:
  - fragment: { owner: self.parent, kind: techspec, authored: draft.technical-specification }
  - fragment: { owner: self.parent, kind: pubapi, authored: draft.public-surface }
  - fragment: { owner: self.parent, kind: privapi, authored: draft.private-surface }
delivery:
  phase: generation
  agent_step: design
