# seed-docs/siege-prompts/subcomparch.md is the prose source.
# produces: writes onto self.parent — the subcomp. Only three
# fragments, not five: siege's own subcomparch grammar has no
# <policies> or <failure-surface> section at all — policy
# reachability is transitive from comp-level policies, so a
# subcomp mints no policies of its own, and failure modes route
# through pubapi's typed return shapes instead ("Failure-mode
# observability through pubapi" in the source prompt). Recorded in
# systems/platform_content.md as a deliberate 3-vs-5
# fragment-ownership split between comp and subcomp, since the
# ticket's fragment vocabulary is a closed set of 5 kinds but not
# every kind is owned at every scope that fragments exist on. v5
# growth (docs/v5-design-decisions.md §2.5, §6): a process inventory.
tier: subcomparch
scope: per(subcomp)
identity: id
fields:
  role_summary: draft.technical-specification
handle:
  fields: [id, role_summary]
  fragments: []
draft:
  root_tag: subcomparch
  grammar: schemas/subcomparch.xsd
generator: llm
prompt: prompts/subcomparch.md.liquid
context:
  - self.parent.handle
  - self.parent.dependency -> subcomp.handle.fragments[pubapi]
  - self.reference -> ref.handle
produces:
  - fragment: { owner: self.parent, kind: techspec, authored: draft.technical-specification }
  - fragment: { owner: self.parent, kind: pubapi, authored: draft.public-surface }
  - fragment: { owner: self.parent, kind: privapi, authored: draft.private-surface }
delivery:
  phase: generation
  agent_step: design
