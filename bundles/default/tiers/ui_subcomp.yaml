# A "join target" tier, subcomp's own shape (tiers/subcomp.yaml):
# minted by ui_collarch's `decomposition` edge (edges/decomposition.yaml)
# from a <subcomponent> row, content lives in the (three) fragments
# ui_subcomparch writes onto self.parent. `parent_*` fields mirror the
# ui_coll-level fragments ui_collarch already wrote (mint-time copy,
# same reasoning as subcomp.yaml's own parent_* fields: ui_subcomparch
# and impl_ui are both per(ui_subcomp), one hop from this node, and a
# live reversed walk back to ui_coll buys nothing over a plain scalar
# for content that only changes on a re-decomposition, which re-mints
# ui_subcomp anyway).
tier: ui_subcomp
scope: child_of(ui_collarch)
identity: id
fields:
  name: mint.name
  purpose: mint.purpose
  owns_summary: mint.owns_summary
  parent_techspec: mint.parent_techspec
  parent_pubapi: mint.parent_pubapi
  parent_privapi: mint.parent_privapi
  parent_policies_summary: mint.parent_policies_summary
  parent_failure_surface: mint.parent_failure_surface
handle:
  fields:
    [
      id,
      name,
      purpose,
      owns_summary,
      parent_techspec,
      parent_pubapi,
      parent_privapi,
      parent_policies_summary,
      parent_failure_surface,
    ]
  fragments: [techspec, pubapi, privapi]
generator: synthesis
