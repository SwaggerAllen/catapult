# v5 §4.3's screen definitions: product-tier surfaces, states,
# affordances, IA graph — no visuals, no components
# (systems/platform_content.md's ORC-109 entry). `scope:
# per(feature_expansion)`, the same as journeys — not `child_of
# (journey)`: a screen legitimately named by more than one journey's
# walk (v5 §4.2's "screen belongs to 0..n journeys") would mint as two
# different nodes under a per-journey fanout. Minting every screen in
# one pass (journey-driven and standalone alike) is what keeps the
# pool deduplicated. `all.journey.handle` — the individual children,
# not `all.journeys.handle` (journeys' own handle carries no per-row
# content, matching requirements' own handle today) — is the walk
# that actually reaches each journey's ordered screen-walk and state
# block, so this pass can author matching screens before the formal
# journey->screen reference (edges/reference.yaml) exists to check
# against. `input.mocks` (ORC-110, systems/platform_content.md) reads
# mock evidence directly at this tier rather than only through
# feature_expansion's own extraction — visual and state evidence
# shapes screen definitions without surviving two abstraction
# rotations first.
tier: screens
scope: per(feature_expansion)
identity: id
fields:
  intro: draft.introduction
handle:
  fields: [id, intro]
  fragments: []
draft:
  root_tag: screens
  grammar: schemas/screens.xsd
generator: llm
executor:
  effort: max
prompt: prompts/screens.md.liquid
context:
  - self.parent.handle
  - all.journey.handle
  - input.mocks
delivery:
  phase: generation
  agent_step: design
