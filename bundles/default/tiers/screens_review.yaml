# docs/v5-design-decisions.md §7.19, dsl-syntax.md §3.3: a review is
# a tier, not a nested block. `reviews: screens` fixes this review's
# scope, identity and cardinality to screens' own — not restated.
# `context:` is the same set of walks as screens' own, checked at
# load time rather than trusted. `screen`, the projection tier
# screens mints, gets no review tier of its own — the same reasoning
# as journeys_review.yaml.
tier: screens_review
reviews: screens
generator: llm
prompt: prompts/review/screens.md.liquid
grammar: schemas/review.xsd
context:
  - self.parent.handle
  - all.journey.handle
delivery:
  phase: critique
  agent_step: critique
