# Projection tier, comp's own shape: no draft, no prompt — minted by
# screens' own `decomposition` instance (edges/decomposition.yaml)
# from each <screen> row. Journey membership and navigation are edges
# (edges/reference.yaml's journey->screen instance, edges/navigation
# .yaml) rather than fields here, the same reason comp doesn't mint
# `dependency`/`fulfills` as fields — a downstream reader walks the
# edge, it doesn't read a copied field. `screen_group` is a free-form
# signal into `frontend_sysarch`'s later IA-region grouping (v5
# §4.3, §5.3) — carried here, resolved downstream.
tier: screen
scope: child_of(screens)
identity: id
fields:
  slug: mint.slug
  purpose: mint.purpose
  feats: mint.feats
  states: mint.states
  affordances: mint.affordances
  displayed_data: mint.displayed_data
  screen_group: mint.screen_group
handle:
  fields:
    [id, slug, purpose, feats, states, affordances, displayed_data, screen_group]
  fragments: []
generator: synthesis
