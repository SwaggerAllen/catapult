# v5 §4.5, revised at ORC-236: refs are purely tool-authored — content
# supplied, no draft, no review, no approval. A supplied tier having no
# scope at all (`chain.md` #5, #17) names exactly what a ref is: a flat,
# project-scoped pool of nodes created directly by a write path outside
# the chain, `id`-identified, never minted by a fanout edge and bound
# to no parent tier — legal only paired with `generator: reference`
# (§3.2), and the pairing is exclusive on purpose: refs are v5 §4.5's
# one deliberate escape hatch, kept general rather than grown a type
# system of per-use variants. No `draft:`, no `prompt:`, no `delivery:`
# — there is no dispatch to phase, since nothing dispatches this tier;
# `fields:` sources from `reference.<name>` (§3), the key names the
# write path's own payload is expected to carry, not a `draft.<path>`
# this tier no longer has a draft to hold. "Any parents and any
# children" (v5 §4.5's redirect) is unchanged: `edges/reference.yaml`
# (comparch/subcomparch/impl, each its own instance under
# dsl-syntax.md §4.1) is the attachment surface, wired at
# comparch-and-below only — refs are an implementation detail, so
# nothing above comparch attaches one.
tier: ref
scope: reference
identity: id
fields:
  title: reference.title
  body: reference.body
handle:
  fields: [id, title, body]
  fragments: []
generator: reference
