# The bug_fix flow's planning tier. No siege prompt exists for this
# flow; authored fresh, for fixing observed problems without
# disturbing the architecture.
#
# `scope: cascade_visit` (dsl-syntax.md §3.1) — one plan per node the
# cascade visits, anchored at the ticket's own originating node.
# v5 has no `seed:` block for a template to read a ticket field from
# (Catapult.Dsl.Flow carries none), so the flow cannot name that
# anchor explicitly. The
# resolution isn't a bundle declaration at all: `flows/bug_fix/
# flow.yaml`'s `ticket.entry: impl` already names which *tier* a
# bug_fix ticket opens against (dsl-syntax.md §6); which *node* a
# given ticket instance is filed against is a plane fact about that
# ticket (the artifact a report was made against), the same category
# of fact every ticket in this pipeline already carries regardless of
# flow, not additional flow.yaml syntax to invent. The engine anchors
# the cascade there and mints this tier's `plan_target` instance
# (edges/plan_target.yaml) from it — out of scope for this ticket to
# build (projection-time instance behavior), but no longer an
# undeliverable gap: the bundle declares everything an engine needs to
# do it. No `sysarch` target here, unlike the other four plans — a
# defect report names a specific artifact, never a project-wide
# re-decomposition.
tier: bug_fix_plan
scope: cascade_visit
identity: id
fields:
  # `argument` is the reserved `fields:` name the work surface reads
  # off a flow's entry tier (ORC-114, docs/dsl-syntax.md §3) — this
  # tier is that entry tier for every bug_fix flow instance.
  argument: draft.argument
  scope_summary: draft.scope
  resolved: draft.resolved
handle:
  fields: [id, scope_summary, resolved]
  fragments: []
draft:
  root_tag: bug-fix-plan
  grammar: schemas/bug_fix_plan.xsd
generator: llm
prompt: flows/bug_fix/plan.md.liquid
context:
  # No `ticket.findings` — not yet a registered context source
  # (feature_request_plan.yaml's context: comment explains why); the
  # defect report's own prose (observed/expected/reproduction) has no
  # bundle-declarable home until that extension lands.
  - input.project_doc
  - all.comp.handle
  - self.plan_target -> comparch.handle
  - self.plan_target -> subcomparch.handle
  - self.plan_target -> impl_backend.handle
delivery:
  phase: generation
  agent_step: design
