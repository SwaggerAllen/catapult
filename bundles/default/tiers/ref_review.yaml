# docs/v5-design-decisions.md §7.19, revised: a review is a tier, not
# a nested block on ref.yaml. `reviews: ref` fixes this review's scope
# and cardinality to ref's own (singleton, 1:1) — not restated,
# dsl-syntax.md §3.3. ref.yaml declares no `context:` at all (a flat
# pool with nothing to walk to); this review declares none either, for
# the same reason — the load-time check (§13) is that the two sets are
# equal, and empty equals empty. `draft`/`prior_review` reach the
# prompt automatically (§9).
tier: ref_review
reviews: ref
generator: llm
prompt: prompts/review/ref.md.liquid
grammar: schemas/review.xsd
delivery:
  phase: critique
  agent_step: critique
