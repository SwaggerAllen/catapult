# v5 §5.4's shapes-vs-calls rule: "UI collections depend on backend
# shapes, not backend calls." A UI collection's edge to a backend comp
# is types/handle shapes only — presentational components must be
# stateless (that's what makes the storybook export reviewable without
# a socket), so this edge carries no call semantics. Its own name
# rather than a further `dependency` instance for the identical reason
# `renders`/`calls` are: which family may declare which edge at all is
# the audit-relevant, load-time-checkable fact. Only `ui_collarch`'s
# tier file ever declares this edge, and no instance targets anything
# but backend `comp` — a UI collection has no declared path to a
# backend call at all; the graph itself refuses the shape, and the
# audit's "a backend function invocation inside a UI collection's file
# map is a layering violation" check catches a generated file that
# ignores its own graph anyway (systems/platform_content.md's ORC-111
# entry).
edge: uses_shapes
type: dependency
source: ui_coll
target: comp
declared_in: ui_collarch.draft.dependencies.dep[]
cardinality:
  source: { min: 0 }
  target: { min: 0 }
consistency: eventual
