# v5 §5.4's shapes-vs-calls rule: "UI collections depend on backend
# shapes, not backend calls." A UI collection's edge to a backend comp
# is types/handle shapes only — presentational components must be
# stateless (that's what makes the storybook export reviewable without
# a socket), so this edge carries no call semantics. Its own name
# rather than a further `dependency` instance for the identical reason
# `renders`/`calls` are: which family may declare which edge at all is
# the audit-relevant, load-time-checkable fact. Only `frontend_sysarch`'s
# own `ui-collections.collection[]` rows may carry this edge's
# `declared_in` path (relocated off `ui_collarch`'s own draft, ORC-235
# — `systems/platform_content.md`'s ORC-235 entry: `ui_collarch` reads
# `self.parent.uses_shapes`, unchanged, but the edge is now the minting
# pass's own decision, not the per-collection articulation pass's,
# mirroring `comp<->comp`'s own placement in `sysarch`'s draft) — no
# `screen-collections` row does, and no instance targets anything but
# backend `comp`, which is what makes "a UI collection reads backend
# shapes, never calls" a fact about which edges the *loaded bundle*
# contains, not only about what a generated file happens to do; the
# audit's "a backend function invocation inside a UI collection's file
# map is a layering violation" check catches a generated file that
# ignores its own graph anyway (systems/platform_content.md's ORC-111
# entry).
edge: uses_shapes
type: dependency
source: ui_coll
target: comp
declared_in: frontend_sysarch.draft.ui-collections.collection[].uses-shapes.comp[].@ref
cardinality:
  source: { min: 0 }
  target: { min: 0 }
consistency: eventual
