# v5 §5.4's shapes-vs-calls rule, symmetric to `uses_shapes`: "screen
# collections own all `calls` edges" — a LiveView loads data and
# dispatches actions against boundary exports, handing assigns down to
# the UI collections it renders. Only `screen_collarch`'s tier file
# ever declares this edge; `uses_shapes` has no `screen_coll`-sourced
# instance and this edge has no `ui_coll`-sourced instance, which is
# what makes the layering rule a fact about which edges the *loaded
# bundle* contains, not only about what a generated file happens to do
# (systems/platform_content.md's ORC-111 entry).
edge: calls
type: dependency
source: screen_coll
target: comp
declared_in: screen_collarch.draft.dependencies.dep[]
cardinality:
  source: { min: 0 }
  target: { min: 0 }
consistency: eventual
