# The edge `chain.md` #23 already anticipated ("navigation
# edges [...] are cyclic-legal reference edges" and "must never appear
# in a readiness-bearing context walk") — this ticket is what actually
# declares it (systems/platform_content.md's ORC-109 entry). Declared
# inside screens' own draft, per screen, since both endpoints already
# exist in that same committed draft — no forward reference. Users
# navigate back and forth, so there is no `graph_constraint` at all:
# not `acyclic` (a two-screen loop is the ordinary case, not an
# error), and stating that here is what stops a later bundle author
# wiring these into a context walk's readiness path (v5 §4.3).
edge: navigation
type: reference
navigation: true
source: screen
target: screen
declared_in: screens.draft.screen[].navigation.edge[].@to
cardinality:
  source: { min: 0 } # a terminal screen has no outgoing nav edge
  target: { min: 0 } # an entry screen has no incoming nav edge
