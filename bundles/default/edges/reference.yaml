# Refs are wired into comparch and below only. Attached via
# the attach_reference write tool, which inserts a
# <reference target="ref_id"/> row (v4's own mechanism, carried
# forward) — the loader checks each declared_in segment's spelling
# against its own tier's schema (§13, ORC-232), but not that any row
# actually exists in a committed body, which stays the engine's, at
# commit time. Not
# among this ticket's own five named edges (fulfills, dependency,
# domain_parent, decomposition, policy_application) — ref attachment
# is none of those: not a mint (decomposition), not a comp-fulfills-
# resp binding (fulfills), not a policy scope grain
# (policy_application). Named separately and consolidated the same
# way (dsl-syntax.md §4.1's `instances:`) since it is one mechanism —
# "a tier attaches a reference" — recurring at three sites.
#
# ORC-109 adds three more sites under this same mechanism, not a new
# edge (systems/platform_content.md's own entry): journey->screen
# ("screen belongs to 0..n journeys", v5 §4.2) and requirements'
# integration point, resp->journey / resp->screen. All three are
# ordinary references to already-minted nodes — by the time each
# citing tier runs (screens after journeys; requirements after both),
# every node it cites already exists, so none of them is a forward
# reference the way journey's own informal screen-walk
# (tiers/journey.yaml, schemas/journeys.xsd) has to be.
edge: reference
type: reference
instances:
  - source: comparch
    target: ref
    declared_in: comparch.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: subcomparch
    target: ref
    declared_in: subcomparch.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: impl_backend
    target: ref
    declared_in: impl_backend.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  # ORC-111: the UI and screen families each gain the same
  # reference -> ref attachment site backend's comparch, subcomparch
  # and impl already have, at every generator: llm tier that isn't a
  # join target (systems/platform_content.md's ORC-111 entry) — six
  # more sites under this same mechanism, not a new edge.
  - source: ui_collarch
    target: ref
    declared_in: ui_collarch.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: ui_subcomparch
    target: ref
    declared_in: ui_subcomparch.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: impl_ui
    target: ref
    declared_in: impl_ui.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: screen_collarch
    target: ref
    declared_in: screen_collarch.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: screen_subcomparch
    target: ref
    declared_in: screen_subcomparch.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: impl_screen
    target: ref
    declared_in: impl_screen.draft.references.reference[].@target
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: journey
    target: screen
    declared_in: screens.draft.screen[].journeys.journey[].@ref
    cardinality:
      source: { min: 1 } # a journey walks through >=1 screen
      target: { min: 0 } # standalone screens are legal (v5 §4.2)

  - source: resp
    target: journey
    declared_in: requirements.draft.responsibility[].journeys.journey[].@ref
    cardinality:
      source: { min: 0 } # a responsibility may ground in no product surface
      target: { min: 0 } # a journey may back no responsibility yet

  - source: resp
    target: screen
    declared_in: requirements.draft.responsibility[].screens.screen[].@ref
    cardinality:
      source: { min: 0 } # requirements prefers a journey ref; direct screen
      # refs are the fallback for standalone screens (v5 §4.2)
      target: { min: 0 }

  # ORC-111: "consumes journey state" — declared at articulation time
  # (screen_collarch's own draft), not at frontend_sysarch's mint time,
  # since which journeys a collection actually needs state from is a
  # design decision for that collection's own pass, not a grouping fact
  # frontend_sysarch can read off IA region alone
  # (systems/platform_content.md's ORC-111 entry).
  - source: screen_coll
    target: journey
    declared_in: screen_collarch.draft.journeys.journey[].@ref
    cardinality:
      source: { min: 0 } # a collection may consume no journey's live state
      target: { min: 0 } # a journey may back no screen collection directly —
      # it already reaches its screens through the product-tier
      # journey -> screen instance above
