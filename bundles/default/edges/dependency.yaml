# Two halves — project-wide comp→comp and within-comp
# subcomp→subcomp — one mechanism, one name (this ticket's edges
# section: "dependency covers comp→comp and subcomp→subcomp through
# one declaration"). Previously two files (dependency, sub_dependency);
# dsl-syntax.md §4.1's `instances:` form is what makes one file
# possible without losing the fact that a subcomp-to-subcomp
# dependency is scoped to siblings under the same comparch instance
# (each dep is declared inside that one comparch's own draft, not a
# project-wide list — the same scoping subtlety sub_dependency.yaml
# used to carry alone).
edge: dependency
type: dependency
instances:
  - source: comp
    target: comp
    declared_in: sysarch.draft.dependencies.dep[]
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: subcomp
    target: subcomp
    declared_in: comparch.draft.sub_dependencies.dep[]
    cardinality:
      source: { min: 0 }
      target: { min: 0 }
graph_constraint: [acyclic, no_self_loop]
consistency: eventual
