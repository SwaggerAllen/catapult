# Two halves — project-wide comp→comp and within-comp
# subcomp→subcomp — one mechanism, one name (this ticket's edges
# section: "dependency covers comp→comp and subcomp→subcomp through
# one declaration"). Previously two files (dependency, sub_dependency);
# `chain.md` #27's `instances:` form is what makes one file
# possible without losing the fact that a subcomp-to-subcomp
# dependency is scoped to siblings under the same comparch instance
# (each dep is declared inside that one comparch's own draft, not a
# project-wide list — the same scoping subtlety sub_dependency.yaml
# used to carry alone).
edge: dependency
type: dependency
instances:
  # These two, and the four sibling-scoped instances below, are the
  # residual locator case (`chain.md` #27): neither end is `self`,
  # `self.parent`, a fanout element, nor a `scope: singleton` tier —
  # `sysarch.draft.dependencies.dep[]` shares no prefix with
  # `decomposition`'s own `comp` fanout locus, and `sysarch`'s own
  # parent is `requirements`, neither endpoint — so both sides need an
  # explicit locator naming the `<dep>` element's own attribute pair
  # (`systems/platform_content.md`'s ORC-236 entry).
  - source: comp
    target: comp
    declared_in: sysarch.draft.dependencies.dep[]
    source_ref: "@from"
    target_ref: "@to"
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: subcomp
    target: subcomp
    declared_in: comparch.draft.sub-dependencies.dep[]
    source_ref: "@from"
    target_ref: "@to"
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  # ORC-111: the UI and screen families gain the identical same-tier
  # dependency shape as comp/subcomp above — project-wide at the
  # collection level (declared in frontend_sysarch's own draft, the
  # tier that mints both collection pools, mirroring comp<->comp's own
  # placement in sysarch's draft rather than comparch's), sibling-
  # scoped at the subcomponent level (declared in each family's own
  # collarch, mirroring subcomp<->subcomp) (systems/platform_content.md's
  # ORC-111 entry).
  - source: ui_coll
    target: ui_coll
    declared_in: frontend_sysarch.draft.ui-dependencies.dep[]
    source_ref: "@from"
    target_ref: "@to"
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: ui_subcomp
    target: ui_subcomp
    declared_in: ui_collarch.draft.sub-dependencies.dep[]
    source_ref: "@from"
    target_ref: "@to"
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: screen_coll
    target: screen_coll
    declared_in: frontend_sysarch.draft.screen-dependencies.dep[]
    source_ref: "@from"
    target_ref: "@to"
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  - source: screen_subcomp
    target: screen_subcomp
    declared_in: screen_collarch.draft.sub-dependencies.dep[]
    source_ref: "@from"
    target_ref: "@to"
    cardinality:
      source: { min: 0 }
      target: { min: 0 }

  # v5 §5.4's "ui_coll -> design_system (primitives)" edge: ORC-110
  # minted the design_system tier and named this edge as ORC-111's own
  # to make (systems/core_dsl.md's ORC-110 entry, now closed). A
  # further `dependency` instance rather than a new edge name — the
  # mechanism is "a ui_coll depends on something", the same mechanism
  # as the sibling instance above, just a different target tier. A
  # project supplying no design_system simply has no instance of this
  # edge to declare (design_system mints at most one node project-wide,
  # tiers/design_system.yaml).
  - source: ui_coll
    target: design_system
    declared_in: ui_collarch.draft.primitives.design-system[]
    cardinality:
      source: { min: 0, max: 1 } # a ui_coll depends on at most one design_system
      target: { min: 0 } # a design_system may be depended on by any number of ui_colls
graph_constraint: [acyclic, no_self_loop]
consistency: eventual
