# The second of policy's two mint sources (policy.yaml explains why two
# fanout edges into one flat pool is legal under the loader). Component-
# local policies minted from comparch's own <policies> block.
edge: policy_fanout_comp
type: fanout
source: comparch
target: policy
declared_in: comparch.draft.policies.policy[]
cardinality:
  source: { min: 0 } # a component may have no local policies
  target: { min: 1, max: 1 } # every policy has exactly one mint
