  - source: refactor_plan
    target: impl_backend
    declared_in: refactor_plan.cascade_target
    cardinality:
      source: { min: 1, max: 1 }
      target: { min: 0 }

  # bug_fix omits sysarch: a defect report's originating_scope is a
  # specific artifact (dsl-syntax.md §6's ticket.entry names impl for
  # this flow), never a project-wide re-decomposition.
  - source: bug_fix_plan
    target: comparch
    declared_in: bug_fix_plan.cascade_target
    cardinality:
      source: { min: 1, max: 1 }
      target: { min: 0 }
  - source: bug_fix_plan
    target: subcomparch
    declared_in: bug_fix_plan.cascade_target
    cardinality:
      source: { min: 1, max: 1 }
      target: { min: 0 }
  - source: bug_fix_plan
    target: impl_backend
    declared_in: bug_fix_plan.cascade_target
    cardinality:
      source: { min: 1, max: 1 }
      target: { min: 0 }

  - source: downward_propagation_plan
    target: sysarch
    declared_in: downward_propagation_plan.cascade_target
    cardinality:
      source: { min: 1, max: 1 }
      target: { min: 0 }
