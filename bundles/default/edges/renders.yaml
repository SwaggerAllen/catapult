# v5 §5.4's frontend edge inventory: `screen_coll -> ui_coll`. A
# screen collection's own composition decision — which UI collections
# it renders — declared in `frontend_sysarch`'s own draft, not
# `screen_collarch`'s (relocated, ORC-235 — `systems/platform_content
# .md`'s ORC-235 entry corrects this bullet's original analogy: the
# moment backend's local `subcomp<->subcomp` deps are decided is
# `comparch`, one tier *above* `subcomparch`, not the reading tier
# itself, so `renders` moves to the identical position —
# `frontend_sysarch`, the pass that mints both collections and is
# already deciding their relationship — mirroring `comp<->comp`'s own
# placement in `sysarch`'s draft). `screen_collarch`'s own
# `self.parent.renders -> ui_coll...` context entry is unchanged — it
# still reads which `ui_coll`s its own `screen_coll` renders. Its own
# edge name rather than a further `dependency` instance: the
# audit-relevant fact is *which family may declare which edge at all*,
# and a distinct name makes that a load-time cross-reference check
# rather than a convention someone has to remember to grep for
# (systems/platform_content.md's ORC-111 entry, v5 §5.2's layering
# rule).
edge: renders
type: dependency
source: screen_coll
target: ui_coll
declared_in: frontend_sysarch.draft.screen-collections.collection[].renders.dep[].@to
cardinality:
  source: { min: 0 }
  target: { min: 0 }
consistency: eventual
