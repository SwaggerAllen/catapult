# The fanout mechanism, consolidated under one name per this
# ticket's own instruction ("decomposition covers sysarch→comp,
# comparch→subcomp and feature_expansion→vocab — the mechanism is the
# same") and generalized to every fanout-minted pool in this chain:
# resp (requirements' rotation), policy's three mint sources
# (sysarch's project-level <policies>, comparch's component-local
# <policies>, and non_goals' distilled intake candidates — policy.yaml
# already documents why three fanout sources into one flat pool is
# legal), and journey/screen (journeys' and screens' own rotations —
# the requirements/resp shape, systems/platform_content.md's ORC-109
# entry). Nine sites, one mechanism, one file — `chain.md` #27's
# `instances:` form.
edge: decomposition
type: fanout
instances:
  - source: sysarch
    target: comp
    declared_in: sysarch.draft.components.component[]
    cardinality:
      source: { min: 1 } # every project has ≥1 foundation component
      target: { min: 1, max: 1 } # every comp has exactly one mint

  - source: comparch
    target: subcomp
    declared_in: comparch.draft.subcomponents.subcomponent[]
    cardinality:
      source: { min: 1 } # every comp decomposes into ≥1 subcomponent — v4's
      # "un-fanned-out" escape (a comp with zero subcomps, impl attached
      # directly) needs a scope union this closed set has no form for;
      # dropped as a content simplification
      target: { min: 1, max: 1 } # every subcomp has exactly one mint

  - source: feature_expansion
    target: vocab
    declared_in: feature_expansion.draft.vocabulary.term[]
    cardinality:
      source: { min: 0 } # a project may name no project-specific terms
      target: { min: 1, max: 1 } # every vocab entry has exactly one mint

  - source: requirements
    target: resp
    declared_in: requirements.draft.responsibility[]
    cardinality:
      source: { min: 1 } # every project has at least one responsibility
      target: { min: 1, max: 1 } # every resp has exactly one mint

  - source: sysarch
    target: policy
    declared_in: sysarch.draft.policies.policy[]
    cardinality:
      source: { min: 0 } # a project may have no project-level policies
      target: { min: 1, max: 1 } # every policy has exactly one mint

  - source: comparch
    target: policy
    declared_in: comparch.draft.policies.policy[]
    cardinality:
      source: { min: 0 } # a component may have no local policies
      target: { min: 1, max: 1 } # every policy has exactly one mint

  - source: non_goals
    target: policy
    declared_in: non_goals.draft.candidates.candidate[]
    cardinality:
      source: { min: 0 } # a raft may name no non-goals at all
      target: { min: 1, max: 1 } # every distilled candidate has exactly one mint

  - source: journeys
    target: journey
    declared_in: journeys.draft.journey[]
    cardinality:
      source: { min: 1 } # every project has at least one real journey —
      # standalone screens are the fallback, not the norm (v5 §4.2)
      target: { min: 1, max: 1 } # every journey has exactly one mint

  - source: screens
    target: screen
    declared_in: screens.draft.screen[]
    cardinality:
      source: { min: 1 } # every project has at least one screen
      target: { min: 1, max: 1 } # every screen has exactly one mint

  # ORC-111: frontend_sysarch fans out both collection families in one
  # pass — the same "one source, several target tiers" shape sysarch's
  # own comp/policy instances above already use, not a new mechanism
  # (systems/platform_content.md's ORC-111 entry).
  - source: frontend_sysarch
    target: ui_coll
    declared_in: frontend_sysarch.draft.ui-collections.collection[]
    cardinality:
      source: { min: 0 } # a project may seed no shared UI collections
      target: { min: 1, max: 1 } # every ui_coll has exactly one mint

  - source: frontend_sysarch
    target: screen_coll
    declared_in: frontend_sysarch.draft.screen-collections.collection[]
    cardinality:
      source: { min: 1 } # every project's screens need >=1 hosting collection
      target: { min: 1, max: 1 } # every screen_coll has exactly one mint

  - source: ui_collarch
    target: ui_subcomp
    declared_in: ui_collarch.draft.subcomponents.subcomponent[]
    cardinality:
      source: { min: 1 } # every ui_coll decomposes into >=1 subcomponent,
      # the same closed-scope-set reason comparch->subcomp gives above
      target: { min: 1, max: 1 } # every ui_subcomp has exactly one mint

  - source: screen_collarch
    target: screen_subcomp
    declared_in: screen_collarch.draft.subcomponents.subcomponent[]
    cardinality:
      source: { min: 1 } # every screen_coll decomposes into >=1 subcomponent
      target: { min: 1, max: 1 } # every screen_subcomp has exactly one mint
