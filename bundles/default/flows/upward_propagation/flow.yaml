# The upward_propagation flow — the one place this bundle uses
# `up_then_down` rather than `downward_cascade`: a downstream argument
# suggests an upstream decision was wrong (a comparch flags its
# fulfilled responsibilities as infeasible, a subcomparch flags its
# parent's pubapi as under-specified), so the walk visits the upstream
# scope first and only re-opens the downstream cascade after the
# upstream re-approves.
flow: upward_propagation
delta:
  tiers: [tiers/upward_propagation_plan.yaml]
  edges: [edges/plan_target.yaml]
walk: up_then_down
ticket:
  entry: comparch
  labels: []
completion: upward_propagation_complete
