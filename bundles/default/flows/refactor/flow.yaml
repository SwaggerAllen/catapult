# The refactor flow. Walk: downward_cascade, same direction as
# feature_request — the difference is scope discipline (reshaping
# existing delivery, not adding new functionality), enforced by the
# planning tier's own prompt rather than by a different walk shape.
flow: refactor
delta:
  tiers: [tiers/refactor_plan.yaml]
  edges: [edges/plan_target.yaml]
walk: downward_cascade
ticket:
  entry: sysarch
  labels: []
completion: refactor_complete
