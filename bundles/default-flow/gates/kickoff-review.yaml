review: kickoff-review
role: author                       # the author's own manual pass across
                                    #   the milestone's kickoff plan — the
                                    #   identical irreducibly-human role
                                    #   milestone-signoff.yaml already
                                    #   gives the other side of the
                                    #   container's own working period
                                    #   (v5 §7.8)
depth: 0
throwback: setup                   # a real override, not a restatement
                                    #   of the derived default
                                    #   (dsl-syntax.md §15.10, fourth-pass
                                    #   correction): this group's own
                                    #   leading pending precedes setup
                                    #   (types/milestone.yaml), so the
                                    #   undeclared default would be that
                                    #   pending, not setup itself —
                                    #   declaring setup skips the wait
                                    #   and re-runs the agent step
                                    #   directly
escalation: author
