type: setup
skeleton: ticket
# The forward-looking agent (v5 §7.8): grooms, sets blockers, and fills
# the next container's `prep`. An *ordinary work item with its own
# bundles, dispatched by machinery that already exists* — never a
# reserved agent-step slot the way the retired `boundary` was (§15.1).
# Nothing in the grammar special-cases it by name; it is `milestone`'s
# own `setup` entry declaring `flow: setup` that gives it its job.
statuses:
  - status: pending
  - status: generation
  - status: checks
  - status: merge
  - status: deploy
  - status: terminal
