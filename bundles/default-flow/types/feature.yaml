type: feature
skeleton: ticket                   # dsl-syntax.md §15.1: pending, then
                                    #   generation/gates interleaved, then
                                    #   checks, merge, deploy, terminal
statuses:
  - - status: pending             # the sub-array's own head (§13, §15.1,
                                    #   a design-review tightening,
                                    #   ORC-151): one pending per
                                    #   generation-shaped entry, never
                                    #   shared, so a grouped entry's own
                                    #   pending sits inside its group
    - status: generation           # a bare, unnamed sub-array (§15.10):
                                    #   generation and everything that
                                    #   reviews it resolve together. It
                                    #   holds exactly one non-critique
                                    #   agent-balled entry — this one —
                                    #   which is what both gates below
                                    #   fall back to when they decline
    - status: critique
      depth: [2, 0]                # carried forward from the retired
                                    #   critique.yaml (ORC-92): 2 for a
                                    #   project's first traversal — the
                                    #   architecture chain's own deepest
                                    #   fan-out is two edges deep — 0 for
                                    #   every later traversal
    - review: ux-review
    - review: engineering-review
  - status: checks
  - status: reconcile             # reads the produced PR against its own
                                   #   argument, before merge (dsl-syntax.md
                                   #   §15.1, §15.11) — required wherever
                                   #   merge is, ORC-151
  - status: merge
  - environment: staging
  - status: deploy
  - status: terminal
