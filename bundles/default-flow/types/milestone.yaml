type: milestone
skeleton: container                # setup, prep, main, retro, cleanup each
                                    #   at least once, in that relative
                                    #   order, then terminal — a required
                                    #   backbone, never an exclusive
                                    #   membership (dsl-syntax.md §15.1,
                                    #   ORC-148)
statuses:
  - - status: pending               # setup's own leading entry (ORC-155)
                                     #   — not a grammar requirement,
                                     #   since setup is not
                                     #   generation-shaped (§13), but the
                                     #   identical dispatch-wait
                                     #   convention every generation-
                                     #   shaped sub-array already carries
    - status: setup                 # the container's own forward-looking
                                     #   agent step, inline (ORC-148) —
                                     #   dispatches by chain-side tier,
                                     #   not by flow:
    - review: kickoff-review        # a human reads the milestone's own
                                     #   plan before prep/main ever open
                                     #   (ORC-155) — named for what it
                                     #   reviews, never for the anchor it
                                     #   sits beside (§11)
  - status: prep                    # work the milestone requires before
    flow: feature                   #   beginning (v5 §7.8)
  - status: main
    flow: feature
    blocks: [retro]                 # the general form of "the retro can't
                                     #   finish while milestone work is
                                     #   open" (§15.7) — and what holds
                                     #   `retro` open for a red `:live`
                                     #   verdict (v5 §2.8, §7.8). `retro`
                                     #   sits inside the sub-array below;
                                     #   the reference reaches the whole
                                     #   group through it (§13, §15.10)
  - - review: milestone-signoff      # the author's first transition: "my
                                      #   manual pass is finished" (v5
                                      #   §7.8's irreducibly-human list).
                                      #   No leading pending of its own —
                                      #   unlike setup's group above, this
                                      #   one would collide, bare, with
                                      #   that one (§15.12's own
                                      #   uniqueness check is a load-time
                                      #   concern; the collision that
                                      #   actually rules it out here is a
                                      #   runtime one, ContainerLifecycle
                                      #   .Sequence's own bare-name lookup
                                      #   having no namespace awareness —
                                      #   see dsl-syntax.md §15.2)
    - status: retro                  # the container's other agent step,
                                      #   inline the identical way as
                                      #   setup, grouped with the sign-off
                                      #   gates around it (§15.10)
    - review: proposals-read         # the author's second transition: "I
                                      #   have read the proposals."
                                      #   Accepting or declining what
                                      #   retro filed is the author's act,
                                      #   never the plane's (v5 §7.8)
  - status: cleanup                  # work that got missed during the
    flow: feature                    #   milestone — distinct on purpose
                                      #   from the next milestone's prep
                                      #   (v5 §7.8, §4.5). Neither this
                                      #   nor retro produces code any
                                      #   longer (ORC-155): feature flows
                                      #   (prep, main) are the only things
                                      #   that merge, each through its own
                                      #   feature.yaml instance
  - environment: prod                # a citation, not a declaration — the
                                      #   milestone's own promotion of the
                                      #   whole, once every feature nested
                                      #   under prep/main has already
                                      #   deployed itself individually to
                                      #   staging and retro's own findings
                                      #   are adjudicated and cleanup is
                                      #   done (ORC-155). promote_from:
                                      #   lives on environments/prod.yaml's
                                      #   own declaration (§15.4)
  - status: deploy
  - status: terminal                 # the fixed end kind, not a further
                                      #   queue name (§15.6) — so no flow:
