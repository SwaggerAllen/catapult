type: milestone
skeleton: container                # the five fixed anchors, each exactly
                                    #   once, in exactly this order, then
                                    #   terminal (dsl-syntax.md §15.1)
statuses:
  - status: setup
    flow: setup
    singleton: true                # at most one work item, *ever* — not
                                    #   0-or-1 at a time (§15.7): once its
                                    #   one work item is terminal the
                                    #   queue is permanently closed, which
                                    #   is what the declaration asked for
  - status: prep                   # work the milestone requires before
    flow: feature                   #   beginning (v5 §7.8)
  - status: main
    flow: feature
    blocks: [retro]                # the general form of "the retro can't
                                    #   finish while milestone work is
                                    #   open" (§15.7) — and what holds
                                    #   `retro` open for a red `:live`
                                    #   verdict (v5 §2.8, §7.8)
  - review: milestone-signoff      # the author's first transition: "my
                                    #   manual pass is finished" (v5 §7.8's
                                    #   irreducibly-human list). Legal on a
                                    #   container since the fifth pass
                                    #   widened gates onto every type
                                    #   (§15.2)
  - status: retro
    flow: retro
    singleton: true
  - review: proposals-read         # the author's second transition: "I
                                    #   have read the proposals." Accepting
                                    #   or declining what `retro` filed is
                                    #   the author's act, never the plane's
                                    #   (v5 §7.8)
  - status: cleanup                # work that got missed during the
    flow: feature                   #   milestone — distinct on purpose
                                    #   from the next milestone's `prep`
                                    #   (v5 §7.8, §4.5)
  - status: terminal               # the fixed end kind, not a further
                                    #   queue name (§15.6) — so no flow:
