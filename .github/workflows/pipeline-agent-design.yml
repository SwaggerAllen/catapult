# Project stub: design agent.
#
# run-name is load-bearing: "pipeline: design <ticket>" is how the
# control plane correlates this run to its ticket (stale claims, busy
# checks). Set it exactly.
name: pipeline-agent-design
run-name: "pipeline: design ${{ inputs.ticket }}"

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket key, e.g. PIPE-12
        required: true
        type: string

# Every pipeline command builds a snapshot first, and the snapshot has a
# fixed read-set: the agent run list (actions), the open PRs
# (pull-requests), each PR head's CI verdict (checks), and commit
# ancestry (contents). Those are needed even by a run that only writes a
# comment — the cost of reading the world, not of changing it. A missing
# one surfaces as an HTTP 403 partway through the claim.
#
# Opening the draft PR additionally needs the repository setting
# Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". No workflow file can grant it.
permissions:
  contents: write # commits screens/ and systems/, and reads ancestry
  pull-requests: write # opens the ticket's PR, and reads the open list
  actions: read # the snapshot's agent run list
  checks: read # CI verdict per PR head
  deployments: read # deploy state, when the provider is "github"

jobs:
  design:
    runs-on: ubuntu-latest
    # This job's environment is ci.yml's job environment, because the
    # commands are the same commands: an agent runs the config's
    # qualityGates before it finishes, and the live suite runs the
    # project's test command. Copy ci.yml's `env`/`services` across when
    # either changes — three runs here were spent bootstrapping this by
    # hand (Postgres installed but stopped; deps unfetched, which fails
    # `mix format` at :import_deps before any gate runs).
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGUSER: catapult
      PGPASSWORD: catapult
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catapult
          POSTGRES_PASSWORD: catapult
          POSTGRES_DB: catapult_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # fetch-depth: 0 — the agent switches to the ticket branch.
      # Checked out with the agent token so the push carries it. The
      # default GITHUB_TOKEN works for the push itself, but GitHub does
      # not start a workflow run from an event it created — so CI never
      # ran, previews never built, deploys were never recorded — and a
      # PR it opens is authored by github-actions[bot], which GitHub
      # gates behind a manual approval on every ticket. See SETUP 2.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          fetch-depth: 0

      # ---- this project's toolchain, before the agent runs --------------
      # The whole reason the pipeline ships composite actions rather than
      # reusable workflows: a reusable workflow cannot accept `uses:`
      # steps, so there was nowhere to put this and agents ran without
      # the language they were being asked to write in. Replace with
      # whatever this project needs.
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      # Both mix projects: CLAUDE.md's verification block runs the
      # substrate suite separately, and its deps are its own.
      - run: mix deps.get
      - run: mix deps.get
        working-directory: components/substrate
      # ------------------------------------------------------------------

      # Pin to a pipeline release tag (@v1) once one exists; main while
      # the pipeline itself is under construction (DESIGN §5).
      - uses: SwaggerAllen/orchestration/.github/actions/agent-design@main
        with:
          ticket: ${{ inputs.ticket }}
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
          pipeline_state_token: ${{ secrets.PIPELINE_STATE_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          pipeline_repo_token: ${{ secrets.PIPELINE_REPO_TOKEN }}
