# Project stub: live suite.
#
# run-name is load-bearing: "pipeline: live-suite <ticket>" is how the
# control plane correlates this run to its ticket (stale claims, busy
# checks). Set it exactly.
name: pipeline-live-suite
run-name: "pipeline: live-suite ${{ inputs.ticket }}"

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Boundary ticket key
        required: true
        type: string

# Every pipeline command builds a snapshot first, and the snapshot has a
# fixed read-set: the agent run list (actions), the open PRs
# (pull-requests), each PR head's CI verdict (checks), and commit
# ancestry (contents). Those are needed even by a run that only writes a
# comment — the cost of reading the world, not of changing it. A missing
# one surfaces as an HTTP 403 partway through the claim.
permissions:
  contents: read # checkout, and ancestry for the snapshot
  pull-requests: read # the snapshot's open PR list
  actions: read # the snapshot's agent run list
  checks: read # CI verdict per PR head
  deployments: read # deploy state, when the provider is "github"

jobs:
  live:
    runs-on: ubuntu-latest
    # This job's environment is ci.yml's job environment, because the
    # commands are the same commands: an agent runs the config's
    # qualityGates before it finishes, and the live suite runs the
    # project's test command. Copy ci.yml's `env`/`services` across when
    # either changes — three runs here were spent bootstrapping this by
    # hand (Postgres installed but stopped; deps unfetched, which fails
    # `mix format` at :import_deps before any gate runs).
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGUSER: catapult
      PGPASSWORD: catapult
      # The one thing this job needs that ci.yml does not, so copying
      # ci.yml across never surfaces it: CI makes no outbound GitHub
      # call, and the `:live` chain test makes two — reset the bound
      # fixture repo's contents, then dispatch a real workflow_dispatch
      # against it (Catapult.Delivery.HostPort.Actions, SETUP.md §2).
      #
      # Job-level rather than on the `mix test` step: config/test.exs
      # reads this with System.get_env at config-load time, which
      # happens during deps.get and compile, not only at test time.
      #
      # Absent, the suite does not fail loudly — config/test.exs falls
      # back to a "test-token" sentinel and GitHub answers 401 Bad
      # credentials, which reads exactly like a revoked token or an
      # adapter bug. Two milestone boundaries were lost to that before
      # this line existed.
      DELIVERY_GITHUB_TOKEN: ${{ secrets.DELIVERY_GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catapult
          POSTGRES_PASSWORD: catapult
          POSTGRES_DB: catapult_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # ---- this project's toolchain, before the agent runs --------------
      # The suite is this project's own test command, so its toolchain
      # has to exist before the action runs. This is the clearest case
      # for composite actions over reusable workflows: the old reusable
      # workflow said the toolchain "belongs in the stub", which its own
      # shape made impossible.
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      # Both mix projects: CLAUDE.md's verification block runs the
      # substrate suite separately, and its deps are its own.
      - run: mix deps.get
      - run: mix deps.get
        working-directory: components/substrate
      # ------------------------------------------------------------------

      # Pin to a pipeline release tag (@v1) once one exists; main while
      # the pipeline itself is under construction (DESIGN §5).
      - uses: SwaggerAllen/orchestration/.github/actions/live-suite@main
        with:
          ticket: ${{ inputs.ticket }}
          # The project's :live-tagged tests: real network, real
          # providers, budget-capped. Once per milestone.
          command: "mix test --only live"
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
          github_token: ${{ github.token }}
          pipeline_repo_token: ${{ secrets.PIPELINE_REPO_TOKEN }}
