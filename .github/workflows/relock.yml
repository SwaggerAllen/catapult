# One-shot helper, fired by pushes to the authoring branch and deleted
# once the storybook dependency work lands. It exists because `mix deps.get
# --check-locked` is the first gate in ci.yml: a mix.exs change that
# adds a dependency fails every run until mix.lock matches it, and the
# authoring environment for this change has no BEAM toolchain to
# regenerate the lock with. So the lock is regenerated here, on a
# runner that does, and committed back to the branch that needs it.
#
# It also prints the resolved dependency list, which is what tells the
# author which applications `boundary: check: apps:` in mix.exs has to
# grow to keep `mix catapult.audit`'s coverage check satisfied.
name: relock

on:
  push:
    branches: [claude/catapult-v5-handoff-fc9bhw]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: resolve
        run: mix deps.get

      - name: the resolved application list
        run: ls -1 deps

      - name: commit the lock
        run: |
          set -euo pipefail
          if git diff --quiet -- mix.lock; then
            echo "mix.lock already matches mix.exs; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.lock
          git commit -m "Regenerate mix.lock for the storybook dependencies"
          git push origin HEAD:${{ github.ref_name }}
