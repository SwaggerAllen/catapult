# The gate set (docs/conventions.md §2), in place before the pipeline
# per the build plan: reconciliation trusts green, so the gates predate
# the work. Name is load-bearing later: orchestration's sweep stub
# triggers on this workflow's completion.
#
# PRs into main only (orchestration 423a636's rule): push + bare
# pull_request ran every commit twice for the same verdict, and branch
# protection reads the PR run. Main gets no post-merge run — the PR
# that merged into it is the run; required checks make that a
# guarantee. This repo is orchestration-delivered (ticket branches PR
# into main), so the filter never misses a PR; v5 §7.7's
# no-branch-filter rule applies to plane-delivered projects, not here.
name: ci

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGUSER: catapult
      PGPASSWORD: catapult
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catapult
          POSTGRES_PASSWORD: catapult
          POSTGRES_DB: catapult_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # fetch-depth: 0 — the pipeline-audit step diffs against
      # origin/main, which a shallow PR-merge checkout can't reach.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Exact key only — no `restore-keys` fallback, deliberately (ORC-135).
      # A prefix fallback restores the newest cache matching `mix-Linux-`,
      # which after a lockfile change on this branch is this branch's own
      # *older* `_build`: dependency beams from the previous lockfile, and
      # a boundary reference manifest describing the modules that went
      # with them. That partial state is the one thing the boundary
      # compiler cannot recover from cleanly — `:ets.file2tab` failing
      # falls through to an empty table *silently*, so the run checks only
      # what it compiled and still reports green. Without the fallback the
      # state is binary: an exact hit, or a clean build that compiles and
      # therefore checks everything.
      #
      # It costs close to nothing. Cache reads are scoped to the current
      # branch plus the base branch, and this workflow runs only on
      # `pull_request` — so `main` never writes a cache and no branch can
      # read another's. The fallback could only ever have matched this
      # branch's own earlier run, which hits the exact key anyway unless a
      # lockfile moved. Every branch's first run is already cold.
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            components/substrate/deps
            components/substrate/_build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock', 'components/substrate/mix.lock') }}

      # --check-locked is a hard gate (conventions §2): a silently
      # drifting lockfile is a supply surface and a reproducibility lie.
      - name: deps
        run: mix deps.get --check-locked

      - name: deps audit (vulnerable/retired)
        run: mix deps.audit

      - name: format
        run: mix format --check-formatted

      - name: credo
        run: mix credo --strict

      # Armed by `mix catapult.audit`'s sleeper check when `:phoenix`
      # entered the tree (v5 §2.14). `--exit` makes a finding a failing
      # exit code rather than a report nobody reads.
      #
      # `Config.HTTPS` is ignored because there is no Phoenix endpoint
      # to enable HTTPS on — sobelow says so itself on every run
      # ("cannot find the router"), so the finding is about a surface
      # that does not exist. **Remove this the moment
      # `lib/catapult_web` lands an endpoint** (ORC-35's dev pass), at
      # which point it stops being a false positive and starts being
      # the check it was written to be. Named per-finding rather than
      # absorbed into a `.sobelow-skips` baseline, for the reason
      # `mix.exs`'s own `ignore_advisories` gives: a silent gate
      # re-blinds itself to the next finding.
      - name: sobelow
        run: mix sobelow --exit --skip --ignore Config.HTTPS

      - name: compile (warnings are errors; boundary in the compiler set)
        run: mix compile --warnings-as-errors

      - name: xref cycles
        run: mix xref graph --format cycles --fail-above 0

      # The ratchet, armed at the only number it will ever be cheap to
      # arm at (ORC-49). 0 is measured in both projects today; the engine
      # is the largest influx of `use`-macro compile coupling planned, so
      # arming after it would arm at whatever that work leaves behind.
      # The cap also lives in `qualityGates` so raising it is a reviewed
      # author change (docs/non-goals.md).
      - name: xref compile-connected
        run: mix xref graph --label compile-connected --fail-above 0

      - name: audit
        run: mix catapult.audit

      - name: test
        run: mix test

      # The gate set is a property of a mix project, not of the repo
      # (systems/substrate.md), so this block is conventions §2 in full
      # rather than a subset. `mix hex.audit` stands alone here: at the
      # root it rides inside the `deps.audit` alias, but substrate must
      # not take an audit *dependency* to get one.
      - name: substrate suite
        working-directory: components/substrate
        run: |
          mix deps.get --check-locked
          mix hex.audit
          mix format --check-formatted
          mix credo --strict
          mix compile --warnings-as-errors
          mix xref graph --format cycles --fail-above 0
          mix xref graph --label compile-connected --fail-above 0
          mix catapult.audit
          mix test

      # DESIGN §9's four checks (mutex, doc lint, class, design
      # ownership) via `pipeline audit`. Self-arming: it skips with a notice until the
      # PIPELINE_REPO_TOKEN secret exists (set at hookup, SETUP.md §4)
      # and the branch carries a ticket key — pre-pipeline PRs have
      # neither. The key parses from head_ref, never GITHUB_REF_NAME:
      # under pull_request the ref is refs/pull/N/merge, and "N/merge"
      # silently audits nothing (orchestration's stubs README).
      - name: gate the pipeline audit
        id: audit_gate
        env:
          TOKEN: ${{ secrets.PIPELINE_REPO_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          KEY=$(echo "$BRANCH" | grep -oiE 'orc-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -n "$TOKEN" ] && [ -n "$KEY" ]; then
            { echo "run=true"; echo "key=$KEY"; } >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "pipeline audit skipped:${TOKEN:+}${TOKEN:- no PIPELINE_REPO_TOKEN;}${KEY:+}${KEY:- no ticket key in branch '$BRANCH'}"
          fi
      - name: set up the pipeline
        if: steps.audit_gate.outputs.run == 'true'
        uses: SwaggerAllen/orchestration/.github/actions/setup-pipeline@main
        with:
          pipeline_repo_token: ${{ secrets.PIPELINE_REPO_TOKEN }}
      # --ticket makes the audit fetch the issue's labels and text from
      # Linear (the class check reads both), so it needs the key here —
      # the stubs README's recipe omits this and the first armed run
      # died on it before checking anything.
      - name: pipeline audit (mutex, doc lint, class, design ownership)
        if: steps.audit_gate.outputs.run == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          BASE="origin/main...HEAD"
          git diff --name-only "$BASE" > /tmp/changed
          git diff --diff-filter=A --name-only "$BASE" > /tmp/added
          # What the design agent wrote, and only that. Both agents'
          # commits ride one branch and dev may amend design-owned files
          # on discovery (DESIGN §5), so the plain diff cannot say whose
          # a path was. Two-dot here against three-dot above, and the
          # difference is not cosmetic: "which commits are on this
          # branch" is a different question from "what did the branch
          # change", and git log's three-dot form is a symmetric
          # difference that would drag main's own commits in.
          git log --format=%H --author=pipeline-design-agent origin/main..HEAD \
            | xargs -r -n1 git show --name-only --format= \
            | sort -u > /tmp/design
          pipeline audit --changed-files /tmp/changed --added-files /tmp/added \
            --design-files /tmp/design \
            --ticket "${{ steps.audit_gate.outputs.key }}"
