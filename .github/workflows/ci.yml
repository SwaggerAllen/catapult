# The gate set (docs/conventions.md §2), in place before the pipeline
# per the build plan: reconciliation trusts green, so the gates predate
# the work. Name is load-bearing later: orchestration's sweep stub
# triggers on this workflow's completion.
#
# PRs into main only (orchestration 423a636's rule): push + bare
# pull_request ran every commit twice for the same verdict, and branch
# protection reads the PR run. Main gets no post-merge run — the PR
# that merged into it is the run; required checks make that a
# guarantee. This repo is orchestration-delivered (ticket branches PR
# into main), so the filter never misses a PR; v5 §7.7's
# no-branch-filter rule applies to plane-delivered projects, not here.
name: ci

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGUSER: catapult
      PGPASSWORD: catapult
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catapult
          POSTGRES_PASSWORD: catapult
          POSTGRES_DB: catapult_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # fetch-depth: 0 — the pipeline-audit step diffs against
      # origin/main, which a shallow PR-merge checkout can't reach.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            components/substrate/deps
            components/substrate/_build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock', 'components/substrate/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: deps
        run: |
          mix deps.get
          mix deps.get --check-locked || true

      - name: format
        run: mix format --check-formatted

      - name: credo
        run: mix credo --strict

      - name: compile (warnings are errors; boundary in the compiler set)
        run: mix compile --warnings-as-errors

      - name: audit
        run: mix catapult.audit

      - name: test
        run: mix test

      - name: substrate suite
        working-directory: components/substrate
        run: |
          mix deps.get
          mix format --check-formatted
          mix credo --strict
          mix compile --warnings-as-errors
          mix test

      # DESIGN §9's three checks (mutex, doc lint, class) via
      # `pipeline audit`. Self-arming: it skips with a notice until the
      # PIPELINE_REPO_TOKEN secret exists (set at hookup, SETUP.md §4)
      # and the branch carries a ticket key — pre-pipeline PRs have
      # neither. The key parses from head_ref, never GITHUB_REF_NAME:
      # under pull_request the ref is refs/pull/N/merge, and "N/merge"
      # silently audits nothing (orchestration's stubs README).
      - name: gate the pipeline audit
        id: audit_gate
        env:
          TOKEN: ${{ secrets.PIPELINE_REPO_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          KEY=$(echo "$BRANCH" | grep -oiE 'orc-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -n "$TOKEN" ] && [ -n "$KEY" ]; then
            { echo "run=true"; echo "key=$KEY"; } >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "pipeline audit skipped:${TOKEN:+}${TOKEN:- no PIPELINE_REPO_TOKEN;}${KEY:+}${KEY:- no ticket key in branch '$BRANCH'}"
          fi
      - name: set up the pipeline
        if: steps.audit_gate.outputs.run == 'true'
        uses: SwaggerAllen/orchestration/.github/actions/setup-pipeline@main
        with:
          pipeline_repo_token: ${{ secrets.PIPELINE_REPO_TOKEN }}
      - name: pipeline audit (mutex, doc lint, class)
        if: steps.audit_gate.outputs.run == 'true'
        run: |
          BASE="origin/main...HEAD"
          git diff --name-only "$BASE" > /tmp/changed
          git diff --diff-filter=A --name-only "$BASE" > /tmp/added
          pipeline audit --changed-files /tmp/changed --added-files /tmp/added \
            --ticket "${{ steps.audit_gate.outputs.key }}"
