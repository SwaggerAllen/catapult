# Fixture, not a live workflow file (ORC-10): reviewed here, in the
# plane's own repo, and pushed verbatim to the bound fixture repo
# (SwaggerAllen/catapult-test) by `Catapult.Delivery.HostPort`'s
# `reset_repo/2` — never placed at a real `.github/workflows/**` path
# in *this* repo, because that path is author-owned by GitHub's own
# rule (no `workflow` scope on an agent's push token) regardless of
# what the file inside it is for (`systems/README.md`).
#
# **One harness, beside the rafts rather than inside one.** Both seeds
# push this same file to the same path in the same bound repo —
# `Catapult.ToySeed.reset_files/0` and `Catapult.TodoAppSeed
# .reset_files/0` — so it is raft-independent and lives one level up
# from either raft's own directory. It was briefly duplicated into
# both (`fixtures/toy_seed/` and `fixtures/todo_app/`), which is worse
# than it sounds: the copies write the *same* repo path, so whichever
# seed provisioned last silently decided which harness catapult-test
# carried, and a divergence between them would have had the toy chain
# running under the todo app's harness with nothing to say so. One
# copy removes the question.
#
# This is the target project's half of the dispatch-facing host port
# (`systems/generation.md`, `systems/delivery.md`; v5 §7.12.1):
# GitHub Actions triggers this on `workflow_dispatch`, it fetches the
# rendered context from the plane over an OIDC-authenticated call,
# runs Catapult's own runner harness — reversed from ORC-9's reading
# that the harness was orchestration's pinned dependency
# (`systems/generation.md`'s ORC-215 entry: orchestration delivers
# Catapult, it participates in none of Catapult's own mechanisms) —
# with the named model credential(s), and reports the result back the
# same way. Claude Code is the first agent implementation; the
# run-agent step below is the only implementation-specific piece (v5
# §7.12.1: "a new bindings entry and zero protocol or bundle change")
# — everything around it is the fixed contract: fetch context, run
# agent, report. See `test/catapult/generation/toy_seed_chain_test.exs`
# (offline) and `toy_seed_chain_live_test.exs` (`:live`) for how this
# fits into a run — Catapult's own surface drives one for real (v5
# §7.17); there is no hand-driven runbook anymore (ORC-36 retired it).
name: catapult-dispatch
run-name: "catapult dispatch: ${{ inputs.run_key }}"

on:
  workflow_dispatch:
    inputs:
      run_key:
        description: The plane-minted run correlation id
        required: true
        type: string
      credential_order:
        description: >-
          Comma-separated, ordered list of this repo's own
          model-credential secret names to try (from
          claude_code_oauth_token, anthropic_api_key) — the plane
          names the credentials, never their values (v5 §7.12.1). The
          harness tries each in order, failing over only when an
          attempt classifies as limit-class (usage/rate limits,
          exhausted credits).
        required: true
        type: string
      stub_mode:
        description: >-
          "true" or "false" (GitHub's own inputs are always strings).
          When "true", the harness skips Claude Code entirely and
          reports the tier fixture already pushed to
          .catapult-stub/<root_tag>.xml as a successful run — a
          per-dispatch, plane-decided setting (ORC-223,
          systems/generation.md's ORC-223 entry), never a
          repository-level one.
        required: true
        type: string

permissions:
  id-token: write # GitHub's own OIDC token — what authenticates every
  # call back to the plane below (systems/generation.md's OIDC bullet)
  contents: read

env:
  CATAPULT_BASE_URL: https://catapult-REPLACE-AT-PROVISION.onrender.com # SETUP.md §2 / config/test.exs's :live_base_url

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an OIDC token for the plane's audience
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('catapult')
            core.setSecret(token)
            core.setOutput('token', token)

      # Not conditioned on stub_mode (ORC-223, systems/generation.md's
      # ORC-223 entry): a real run needs the identical working copy for
      # its own eventual commit step once dispatched runs write to
      # branches, and a stub-mode run's own report step needs the
      # .catapult-stub/<root_tag>.xml content reset_repo/2 already
      # pushed here. Default ref is the branch workflow_dispatch fired
      # against — the same branch reset_repo/2 just committed the
      # fixture to, so there is no second writer to race.
      #
      # **Before the context fetch, not after it.** actions/checkout
      # cleans the workspace before checking out (its own `clean`
      # input, default true), so a checkout placed after the fetch
      # deletes the context.json that fetch just wrote there — every
      # dispatch then died with `FileNotFoundError: context.json` at
      # the report step, before it could read anything. Anything this
      # job writes into the workspace has to land after this step.
      - name: Check out the bound repo
        uses: actions/checkout@v4

      - name: Fetch the rendered context
        id: context
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            "$CATAPULT_BASE_URL/dispatch/context/${{ inputs.run_key }}" \
            -o context.json

      - name: Install Claude Code
        if: inputs.stub_mode != 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Runs Catapult's own runner harness (`systems/generation.md`'s
      # ORC-215 entry): tries `inputs.credential_order`'s names in
      # order, each against `claude -p --output-format stream-json`
      # (`--verbose` is that output format's own requirement
      # alongside `-p`). Classification reads two layers of the CLI's
      # own structured output rather than stderr text, precedence
      # ordered rather than a flat three-way split:
      #
      #   - a terminal `result` event's `subtype` — `success` is
      #     success regardless of anything seen earlier in the stream
      #     (a run that retried past a rate-limit and then finished
      #     cleanly still reports success), and its `result` field is
      #     the produced body;
      #   - only once that check fails, `system`/`api_retry` events
      #     seen along the way, whose own `error` category is the
      #     CLI's documented closed ten (`authentication_failed`,
      #     `oauth_org_not_allowed`, `billing_error`, `rate_limit`,
      #     `overloaded`, `invalid_request`, `model_not_found`,
      #     `server_error`, `max_output_tokens`, `unknown`) — a read
      #     of the underlying API error rather than a guess at the
      #     CLI's wording. `rate_limit` and `billing_error` are the
      #     two v5 §7.12.1 names ("usage/rate limits, exhausted
      #     credits") — either marks this attempt limit-class, and if
      #     another credential is still unused the harness fails over
      #     to it. The other seven are stated non-limit assignments,
      #     not an omission: `overloaded` is Anthropic's own capacity
      #     rather than this account's usage or credit standing, the
      #     same reasoning that already keeps `server_error` out of
      #     limit-class; `oauth_org_not_allowed` is credential-shaped
      #     but not usage-shaped, so it joins `authentication_failed`
      #     rather than triggering a failover that would mask a
      #     configuration problem; `model_not_found` joins
      #     `invalid_request`. Every non-success, non-limit-class run
      #     reports `other_failure`, undifferentiated by design: the
      #     terminal `result` object also carries `stop_reason`, and
      #     `stop_reason == "refusal"` is a real, documented signal
      #     for a declined request — the harness chooses not to
      #     consume it because nothing downstream of `other_failure`
      #     reads a finer split today, not because the CLI fails to
      #     expose one (`systems/generation.md`'s own fuller
      #     reasoning, carried here).
      #
      # The subscription credential's own session/weekly ceiling is
      # classified by this same rule on a stated assumption
      # (`systems/generation.md`'s ORC-215 entry): the docs give no
      # event shape for a `-p` run hitting it, only that the run stops
      # rather than waits. A `429` arriving as `api_retry`/`rate_limit`
      # fails over as intended; a terminal `error_during_execution`
      # with no retry event reports `other_failure` and does not — the
      # rule's known blind spot. The first run to hit the ceiling
      # settles which shape is real; its stream is in that run's log.
      - name: Run the agent
        id: agent
        if: inputs.stub_mode != 'true'
        env:
          CREDENTIAL_ORDER: ${{ inputs.credential_order }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          LIMIT_CLASS_ERRORS = {"rate_limit", "billing_error"}
          SECRET_ENV_VARS = {
              "claude_code_oauth_token": "CLAUDE_CODE_OAUTH_TOKEN",
              "anthropic_api_key": "ANTHROPIC_API_KEY",
          }

          with open("context.json") as f:
              prompt = json.load(f)["prompt"]

          names = [name for name in os.environ["CREDENTIAL_ORDER"].split(",") if name]
          base_env = {
              key: value
              for key, value in os.environ.items()
              if key not in SECRET_ENV_VARS.values()
          }

          outcome = {
              "status": "other_failure",
              "reason": "no_credential_available",
              "credential_used": "",
          }

          for index, name in enumerate(names):
              env_var = SECRET_ENV_VARS.get(name)
              value = os.environ.get(env_var, "") if env_var else ""
              if not value:
                  continue

              run_env = dict(base_env)
              run_env[env_var] = value

              try:
                  proc = subprocess.run(
                      ["claude", "-p", "--output-format", "stream-json", "--verbose"],
                      input=prompt,
                      capture_output=True,
                      text=True,
                      env=run_env,
                      timeout=1800,
                  )
              except Exception as error:
                  outcome = {
                      "status": "other_failure",
                      "reason": f"harness_exception: {error}",
                      "credential_used": name,
                  }
                  break

              limit_class = False
              result_event = None

              for line in proc.stdout.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  if event.get("type") == "system" and event.get("subtype") == "api_retry":
                      if event.get("error") in LIMIT_CLASS_ERRORS:
                          limit_class = True
                  if event.get("type") == "result":
                      result_event = event

              if proc.returncode == 0 and result_event and result_event.get("subtype") == "success":
                  outcome = {
                      "status": "success",
                      "body": result_event.get("result", ""),
                      "credential_used": name,
                  }
                  break

              is_last = index == len(names) - 1
              if limit_class and not is_last:
                  print(
                      f"::warning::{name} hit a limit-class failure, failing over",
                      file=sys.stderr,
                  )
                  continue

              outcome = {
                  "status": "limit_class_failure" if limit_class else "other_failure",
                  "reason": (result_event or {}).get("subtype", f"exit_code_{proc.returncode}"),
                  "credential_used": name,
              }
              break

          with open("outcome.json", "w") as f:
              json.dump(outcome, f)
          PY

      # Stub mode's own report (ORC-223, systems/generation.md's
      # ORC-223 entry): the fixture pushed to .catapult-stub/<root_tag>.xml
      # by reset_repo/2, checked out above, reported as a plain
      # success — keyed by root_tag because ContextAssembly.root_tag/1
      # already collapses every reviewed tier's root_tag to the
      # literal "review".
      #
      # A missing fixture (ORC-225, systems/generation.md's ORC-225
      # entry — live-suite run 26) writes the same other_failure shape
      # "Report the result" already knows, naming the root_tag and the
      # exact path looked for, rather than letting open() raise and
      # kill this step before it writes anything — which is what left
      # "Report the result"'s own fallback pointing a reader at "Run
      # the agent", a step stub mode never runs.
      - name: Read the stub fixture
        if: inputs.stub_mode == 'true'
        run: |
          python3 - <<'PY'
          import json

          with open("context.json") as f:
              root_tag = json.load(f)["root_tag"]

          stub_path = f".catapult-stub/{root_tag}.xml"

          try:
              with open(stub_path) as f:
                  body = f.read()
          except FileNotFoundError:
              outcome = {
                  "status": "other_failure",
                  "reason": f"no stub fixture for root_tag '{root_tag}' at {stub_path}",
                  "credential_used": "stub",
              }
          else:
              outcome = {"status": "success", "body": body, "credential_used": "stub"}

          with open("outcome.json", "w") as f:
              json.dump(outcome, f)
          PY

      # Bounds the grammar-retry loop Dispatch.simulate_result/2's own
      # comment already promises ("a further report_result/2 call for
      # the same run_key is expected next") — a promise the harness
      # never kept until now (ORC-223, systems/generation.md's ORC-223
      # entry). Only a `:success` report the grammar rejects (422,
      # decoding to one of the four grammar-class reasons) is
      # retried — same credential, no failover, the same rendered
      # prompt plus the decoded error appended as a corrective turn.
      # Bounded at two retries (three submission attempts total);
      # exhausting the bound reports `other_failure` with
      # `reason: "grammar_retries_exhausted"`, which always completes
      # (`Dispatch.mark_failure/3`'s general clause).
      - name: Report the result
        if: always()
        env:
          RUN_KEY: ${{ inputs.run_key }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          STUB_MODE: ${{ inputs.stub_mode }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          GRAMMAR_REASONS = (
              "{:schema_invalid,",
              "{:root_tag_mismatch,",
              "{:malformed_xml,",
              "{:schema_not_found,",
          )
          SECRET_ENV_VARS = {
              "claude_code_oauth_token": "CLAUDE_CODE_OAUTH_TOKEN",
              "anthropic_api_key": "ANTHROPIC_API_KEY",
          }
          MAX_GRAMMAR_RETRIES = 2

          run_key = os.environ["RUN_KEY"]
          base_url = os.environ["CATAPULT_BASE_URL"]
          stub_mode = os.environ.get("STUB_MODE") == "true"

          if os.path.exists("outcome.json"):
              with open("outcome.json") as f:
                  outcome = json.load(f)
          else:
              outcome = {
                  "status": "other_failure",
                  "reason": "run-agent step produced no outcome.json",
              }

          with open("context.json") as f:
              prompt = json.load(f)["prompt"]

          def run_claude(prompt_text, env_var, value):
              run_env = {
                  k: v for k, v in os.environ.items() if k not in SECRET_ENV_VARS.values()
              }
              run_env[env_var] = value

              try:
                  proc = subprocess.run(
                      ["claude", "-p", "--output-format", "stream-json", "--verbose"],
                      input=prompt_text,
                      capture_output=True,
                      text=True,
                      env=run_env,
                      timeout=1800,
                  )
              except Exception as error:
                  return {"status": "other_failure", "reason": f"harness_exception: {error}"}

              result_event = None
              for line in proc.stdout.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  if event.get("type") == "result":
                      result_event = event

              if proc.returncode == 0 and result_event and result_event.get("subtype") == "success":
                  return {"status": "success", "body": result_event.get("result", "")}

              return {
                  "status": "other_failure",
                  "reason": (result_event or {}).get("subtype", f"exit_code_{proc.returncode}"),
              }

          def is_grammar_rejection(status_code, body_text):
              if status_code != 422:
                  return False
              try:
                  payload = json.loads(body_text)
              except ValueError:
                  return False
              error = payload.get("error", "")
              return isinstance(error, str) and error.startswith(GRAMMAR_REASONS)

          def report(payload):
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{base_url}/dispatch/report/{run_key}",
                  data=data,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {os.environ['OIDC_TOKEN']}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, resp.read().decode("utf-8")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8")

          retries = 0
          credential_used = outcome.get("credential_used", "")
          env_var = SECRET_ENV_VARS.get(credential_used)
          credential_value = os.environ.get(env_var, "") if env_var else ""

          while True:
              status_code, body_text = report(outcome)

              if status_code == 200:
                  break

              retryable = (
                  outcome.get("status") == "success"
                  and not stub_mode
                  and env_var
                  and is_grammar_rejection(status_code, body_text)
              )

              if retryable and retries < MAX_GRAMMAR_RETRIES:
                  retries += 1
                  corrective_prompt = (
                      f"{prompt}\n\nThe previous submission was rejected with:\n{body_text}\n\n"
                      "Correct the response and resubmit the complete document."
                  )
                  outcome = run_claude(corrective_prompt, env_var, credential_value)
                  outcome["credential_used"] = credential_used
                  continue

              if retryable:
                  outcome = {
                      "status": "other_failure",
                      "reason": "grammar_retries_exhausted",
                      "credential_used": credential_used,
                  }
                  report(outcome)

              break
          PY
